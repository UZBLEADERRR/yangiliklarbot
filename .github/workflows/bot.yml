name: Telegram Bot

on:
  schedule:
    - cron: '*/5 * * * *'    # Har 5 daqiqada xabarlarni tekshirish
    - cron: '0 2 * * *'      # Har kuni 07:00 UZ (02:00 UTC) da ertalabki yangiliklar
  workflow_dispatch:          # Qo'lda ishga tushirish uchun

jobs:
  bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Agar soat 02:00 UTC bo'lsa, --morning bayrog'i bilan ishga tushir
          HOUR=$(date +%H)
          if [ "$HOUR" == "02" ]; then
            node bot.js --morning
          else
            node bot.js
          fi

      - name: Save State
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json
          git commit -m "Update state" || exit 0
          git push
